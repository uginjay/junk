<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Фактчекинг прототип</title>
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Фактчекинг (прототип)</h1>
      <p class="subtle">Вставьте драфт текста. Приложение выделит ключевые факты, найдёт источники и оценит тезисы.</p>

      <textarea id="inputText" placeholder="Вставьте текст..." rows="10"></textarea>
      <div class="controls">
        <label>
          Язык
          <select id="language">
            <option value="ru" selected>ru</option>
            <option value="en">en</option>
          </select>
        </label>
        <label>
          Макс. фактов
          <input id="maxClaims" type="number" min="1" max="10" value="5" />
        </label>
        <label>
          Источников на факт
          <input id="maxPerClaim" type="number" min="1" max="5" value="3" />
        </label>
        <button id="runBtn">Проверить</button>
      </div>

      <div id="status" class="status"></div>
      <div id="results" class="results"></div>
    </div>

    <script src="/assets/script.js"></script>
  </body>
</html>

<!doctype html>
<html lang="ru">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Фактчекинг — прототип</title>
	<style>
		body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 24px; }
		.container { max-width: 900px; margin: 0 auto; }
		textarea { width: 100%; min-height: 220px; padding: 12px; font-size: 16px; }
		label { display: block; margin: 12px 0 4px; font-weight: 600; }
		input[type="number"] { width: 120px; padding: 8px; }
		button { padding: 10px 16px; font-size: 16px; cursor: pointer; }
		.card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; background: #fff; }
	</style>
</head>
<body>
	<div class="container">
		<h1>Фактчекинг — прототип</h1>
		<p>Вставьте драфт текста. Сервис извлечет ключевые факты, поищет подтверждения и сформирует отчет.</p>

		<form method="post" action="/factcheck">
			<div class="card">
				<label for="text">Текст</label>
				<textarea id="text" name="text" placeholder="Вставьте текст..." required></textarea>

				<label for="max_claims">Максимум утверждений</label>
				<input id="max_claims" name="max_claims" type="number" min="1" max="12" value="6" />
				<div style="margin-top: 12px;">
					<button type="submit">Проверить факты</button>
				</div>
			</div>
		</form>
	</div>
</body>
</html>
